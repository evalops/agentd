name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create release PR or GitHub release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.AGENTD_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Dispatch CI for Release Please PRs
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRS_JSON: ${{ steps.release.outputs.prs }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches_file="$RUNNER_TEMP/release-pr-branches.txt"
          python3 - <<'PY' > "$branches_file"
          import json
          import os

          prs = json.loads(os.environ.get("PRS_JSON") or "[]")
          for pr in prs:
              branch = pr.get("headBranchName")
              if branch:
                  print(branch)
          PY

          if [[ ! -s "$branches_file" ]]; then
            echo "::error::Release Please reported PRs but did not expose any headBranchName values."
            exit 1
          fi

          while IFS= read -r branch; do
            echo "Dispatching ci.yml for $branch"
            gh workflow run ci.yml --repo "$REPO" --ref "$branch"
          done < "$branches_file"

  package-release:
    name: package release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/package-release.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      checkout_ref: ${{ needs.release-please.outputs.tag_name }}
      release_tag: ${{ needs.release-please.outputs.tag_name }}
      sparkle_download_url: https://github.com/${{ github.repository }}/releases/download/${{ needs.release-please.outputs.tag_name }}/agentd.zip
      upload_release_assets: true
