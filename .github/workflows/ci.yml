name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Swift 6 toolchain
        run: |
          set -euo pipefail
          for xcode in \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.0.app \
            /Applications/Xcode.app
          do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode"
              break
            fi
          done
          swift --version

      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Validate Chronicle contract fixtures
        run: python3 scripts/mock_chronicle.py --self-test Tests/Fixtures/chronicle

      - name: Validate macOS availability floor
        run: python3 scripts/macos_availability_audit.py

      - name: Validate Sparkle appcast tooling
        run: python3 scripts/sparkle_appcast.py self-test

      - name: Validate release metadata
        run: python3 scripts/validate_release_metadata.py

      - name: Validate release-ready PR title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/validate_pr_title.py "$PR_TITLE"

      - name: Lint Swift formatting
        run: xcrun swift-format lint --strict --recursive Sources Tests Package.swift

      - name: Package hardened app bundle
        run: scripts/package_app.sh
